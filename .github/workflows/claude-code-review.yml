name: Claude Code Review

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            1. Find the issue(s) this PR closes with `gh pr view ${{ github.event.pull_request.number }} --json closingIssuesReferences`,
               and read each one with `gh issue view <N>`. If none is linked, take the issue number from the branch name
               (`<N>-...`). If there is still no issue, say so and review the diff only.
            2. Read the changes with `gh pr diff ${{ github.event.pull_request.number }}`.
            3. Check what the issue asks (its Tasks and Acceptance criteria, if it has them) one by one: done, partly done,
               or missing, naming the file/line that shows it.
            4. Give feedback on the changes. If CLAUDE.md has rules for feedback or teaching, follow them;
               otherwise give direct feedback with a suggested fix.
            5. Post one comment with `gh pr comment`: the checklist first, then the feedback.
               Use inline comments only for remarks about a specific line.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*)"
